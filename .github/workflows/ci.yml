name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        env:
          # PR build не знает прод-URL, ставим dummy чтобы сборка не падала.
          # На прод-деплое значение приходит из секрета (см. deploy.yml).
          VITE_API_BASE_URL: http://example.invalid
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          build-args: |
            VITE_API_BASE_URL=http://example.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max
